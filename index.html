<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT Graph Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Jednoduchý štýl pre scrollbar v modálnom okne */
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .modal-content::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .modal-content::-webkit-scrollbar-thumb:hover { background: #555; }
        .dark .modal-content::-webkit-scrollbar-track { background: #1e293b; }
        .dark .modal-content::-webkit-scrollbar-thumb { background: #64748b; }
        .dark .modal-content::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-500">
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const OriginalResponses = ({ responses }) => {
        if (!responses || responses.length === 0) return null;
        return (
            <div className="mt-4">
                <h4 className="text-lg font-semibold text-gray-700 dark:text-gray-300 mb-2">Original AI Responses</h4>
                <div className="space-y-3">
                    {responses.map((resp, index) => (
                        <div key={index} className="bg-gray-100 dark:bg-gray-800 p-3 rounded-lg border dark:border-gray-700">
                            <p className="text-sm text-gray-600 dark:text-gray-400">
                                <span className="font-bold">Response #{index + 1}:</span> {resp}
                            </p>
                        </div>
                    ))}
                </div>
            </div>
        );
    };

    const FullGraphModal = ({ onClose, onShow }) => {
        const [graphImage, setGraphImage] = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);

        useEffect(() => {
            const fetchFullGraph = async () => {
                try {
                    const response = await fetch('http://127.0.0.1:5000/api/full_graph');
                    if (!response.ok) throw new Error('Failed to fetch full graph visualization.');
                    const data = await response.json();
                    setGraphImage(data.visualization_b64);
                } catch (err) {
                    console.error(err);
                    setError(err.message);
                    setGraphImage(null);
                } finally {
                    setLoading(false);
                }
            };
            fetchFullGraph();
        }, []);

        return (
            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50" onClick={onClose}>
                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-6 w-full max-w-4xl relative my-8 max-h-[90vh] overflow-y-auto modal-content" onClick={(e) => e.stopPropagation()}>
                    <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 text-3xl">&times;</button>
                    <h2 className="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-4">Complete Graph Visualization</h2>
                    <p className="text-gray-600 dark:text-gray-400 mb-4">This shows the complete graph with all the nodes and their correlated edges.</p>
                    {loading ? (
                        <div className="flex items-center justify-center h-64">
                            <p className="text-xl text-gray-700 dark:text-gray-300 animate-pulse">Loading graph...</p>
                        </div>
                    ) : error ? (
                        <div className="text-center text-red-500 py-8">Error: {error}</div>
                    ) : graphImage ? (
                        <div className="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg flex justify-center border dark:border-gray-700">
                            <img src={graphImage} alt="Full Graph Visualization" className="max-w-full h-auto" />
                        </div>
                    ) : (
                        <div className="text-center text-red-500 py-8">Failed to load graph image.</div>
                    )}
                </div>
            </div>
        );
    };

    const App = () => {
        const [analyses, setAnalyses] = useState([]);
        const [selectedAnalysis, setSelectedAnalysis] = useState(null);
        const [filters, setFilters] = useState({});
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [attributeMetadata, setAttributeMetadata] = useState({});
        const [counts, setCounts] = useState({});
        const [isDarkMode, setIsDarkMode] = useState(
            () => window.matchMedia('(prefers-color-scheme: dark)').matches || false
        );
        const [showFullGraph, setShowFullGraph] = useState(false);
        const [isAttributeFilterOpen, setIsAttributeFilterOpen] = useState(false);

        useEffect(() => {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }, [isDarkMode]);

        useEffect(() => {
            const fetchData = async () => {
                try {
                    const metadataResponse = await fetch('http://127.0.0.1:5000/api/attribute_metadata');
                    if (!metadataResponse.ok) throw new Error(`Metadata fetch failed: ${metadataResponse.statusText}`);
                    const fetchedMetadata = await metadataResponse.json();
                    setAttributeMetadata(fetchedMetadata);

                    const initialFilters = {
                        claw: false,
                        clique_3: false,
                        clique_4: false,
                        clique_5: false
                    };
                    Object.keys(fetchedMetadata).forEach(attr => { initialFilters[attr] = false; });
                    setFilters(initialFilters);

                    const analysesResponse = await fetch('http://127.0.0.1:5000/api/analyses');
                    if (!analysesResponse.ok) {
                        const errorData = await analysesResponse.json().catch(() => null);
                        throw new Error(errorData?.error || `Analyses fetch failed with status: ${analysesResponse.statusText}`);
                    }
                    const fetchedAnalyses = await analysesResponse.json();
                    setAnalyses(fetchedAnalyses);

                } catch (err) {
                    setError(`Failed to load data from the backend. Reason: ${err.message}. Make sure the server is running and the analysis pipeline has been completed.`);
                } finally {
                    setLoading(false);
                }
            };
            fetchData();
        }, []);

        const handleFilterChange = (e) => {
            const { name, checked } = e.target;
            setFilters(prev => ({ ...prev, [name]: checked }));
        };

        const allAnalysesCount = useMemo(() => {
            const initialCounts = {
                claw: 0, clique_3: 0, clique_4: 0, clique_5: 0
            };
            analyses.forEach(analysis => {
                if (analysis.subgraph_type === 'claw') {
                    initialCounts.claw++;
                } else if (analysis.subgraph_type === 'clique') {
                    const nodeCount = analysis.nodes_data.length;
                    if (nodeCount === 3) initialCounts.clique_3++;
                    if (nodeCount === 4) initialCounts.clique_4++;
                    if (nodeCount === 5) initialCounts.clique_5++;
                }
            });
            return initialCounts;
        }, [analyses]);

        const filteredAnalyses = useMemo(() => {
            const activeStructureFilters = ['claw', 'clique_3', 'clique_4', 'clique_5'].filter(key => filters[key]);
            const activeAttributeFilters = Object.keys(attributeMetadata).filter(key => filters[key]);

            const matchesStructure = (analysis) => {
                if (activeStructureFilters.length === 0) return true;
                return activeStructureFilters.some(filterType => {
                    if (filterType === 'claw' && analysis.subgraph_type === 'claw') {
                        return true;
                    }
                    if (filterType.startsWith('clique_') && analysis.subgraph_type === 'clique') {
                        const cliqueSize = parseInt(filterType.split('_')[1], 10);
                        return analysis.nodes_data.length === cliqueSize;
                    }
                    return false;
                });
            };

            const matchesAttributes = (analysis) => {
                if (activeAttributeFilters.length === 0) return true;
                return activeAttributeFilters.every(attr => analysis.attributes.hasOwnProperty(attr));
            };

            return analyses.filter(analysis => matchesStructure(analysis) && matchesAttributes(analysis));
        }, [analyses, filters, attributeMetadata]);

        useEffect(() => {
            const newCounts = { ...allAnalysesCount };

            const analysesToCountFrom = filteredAnalyses;

            Object.keys(attributeMetadata).forEach(attr => {
                newCounts[attr] = 0;
            });

            analysesToCountFrom.forEach(analysis => {
                 Object.keys(analysis.attributes).forEach(attr => {
                    if (newCounts.hasOwnProperty(attr)) {
                        newCounts[attr]++;
                    }
                });
            });

            setCounts(newCounts);
        }, [filteredAnalyses, allAnalysesCount, attributeMetadata]);

        const handleCardClick = (analysis) => setSelectedAnalysis(analysis);
        const closeModal = () => setSelectedAnalysis(null);
        const closeFullGraphModal = () => setShowFullGraph(false);

        const structureFilters = [
            { name: "claw", label: "Claw" },
            { name: "clique_3", label: "3-Node Clique" },
            { name: "clique_4", label: "4-Node Clique" },
            { name: "clique_5", label: "5-Node Clique" }
        ];

        const attributeFilters = Object.entries(attributeMetadata);

        if (loading) return <div className="flex items-center justify-center min-h-screen font-sans bg-gray-100 dark:bg-gray-900 transition-colors"><p className="text-xl text-gray-700 dark:text-gray-300 animate-pulse">Loading analysis data...</p></div>;
        if (error) return <div className="flex items-center justify-center min-h-screen font-sans p-4 bg-gray-100 dark:bg-gray-900"><div className="bg-red-100 dark:bg-red-900 border border-red-400 dark:border-red-700 text-red-700 dark:text-red-300 px-4 py-3 rounded-lg text-center"><strong className="font-bold">Error:</strong><span className="block sm:inline ml-2">{error}</span></div></div>;

        return (
            <div className="min-h-screen bg-gray-100 dark:bg-gray-900 p-4 sm:p-6 font-sans flex flex-col items-center transition-colors">
                <header className="w-full max-w-6xl text-center mb-8 relative">
                    <h1 className="text-4xl font-bold text-gray-800 dark:text-gray-100 mb-2">Graph Structure Analyzer</h1>
                    <p className="text-lg text-gray-600 dark:text-gray-400">Explore attribute correlations analyzed by a local LLM.</p>
                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="absolute top-0 right-0 p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            {isDarkMode ? (
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                            ) : (
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            )}
                        </svg>
                    </button>
                </header>

                <div className="w-full max-w-6xl bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 mb-8 transition-colors">
                    <h2 className="text-2xl font-semibold text-gray-700 dark:text-gray-200 mb-4">Filter by Structure Type</h2>
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        {structureFilters.map(({ name, label }) => {
                            const count = allAnalysesCount[name] || 0;
                            const isChecked = filters[name] || false;
                            const isDisabled = !isChecked && count === 0 && !loading;
                            return (
                                <label key={name} className={`flex items-center p-2 rounded-lg transition-colors ${isDisabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer bg-gray-50 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600'}`}>
                                    <input
                                        type="checkbox"
                                        name={name}
                                        checked={isChecked}
                                        onChange={handleFilterChange}
                                        disabled={isDisabled}
                                        className="form-checkbox h-5 w-5 text-indigo-600 rounded focus:ring-indigo-500 disabled:bg-gray-300 dark:disabled:bg-gray-500"
                                    />
                                    <span className="ml-2 text-gray-800 dark:text-gray-100 text-sm font-medium">
                                        {label} ({count})
                                    </span>
                                </label>
                            );
                        })}
                    </div>
                </div>

                <div className="w-full max-w-6xl bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 mb-8 transition-colors">
                    {/* ZABALITEĽNÝ FILTER */}
                    <div className="flex justify-between items-center cursor-pointer" onClick={() => setIsAttributeFilterOpen(!isAttributeFilterOpen)}>
                        <h2 className="text-2xl font-semibold text-gray-700 dark:text-gray-200">Filter by Attribute</h2>
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            className={`h-6 w-6 text-gray-500 dark:text-gray-400 transform transition-transform duration-300 ${isAttributeFilterOpen ? 'rotate-180' : ''}`}
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                    {/* Skrytie/Zobrazenie obsahu pomocou triedy "hidden" */}
                    <div className={`mt-4 overflow-hidden transition-all duration-300 ease-in-out ${isAttributeFilterOpen ? 'max-h-96' : 'max-h-0'}`}>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                            {attributeFilters.map(([attrName]) => {
                                const count = counts[attrName] || 0;
                                const isChecked = filters[attrName] || false;
                                const isDisabled = !isChecked && count === 0;

                                return (
                                    <label key={attrName} className={`flex items-center p-2 rounded-lg transition-colors ${isDisabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer bg-gray-50 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600'}`}>
                                        <input
                                            type="checkbox"
                                            name={attrName}
                                            checked={isChecked}
                                            onChange={handleFilterChange}
                                            disabled={isDisabled}
                                            className="form-checkbox h-5 w-5 text-indigo-600 rounded focus:ring-indigo-500 disabled:bg-gray-300 dark:disabled:bg-gray-500"
                                        />
                                        <span className="ml-2 text-gray-800 dark:text-gray-100 text-sm font-medium">
                                            {attrName} ({count})
                                        </span>
                                    </label>
                                );
                            })}
                        </div>
                    </div>
                </div>

                <div className="w-full max-w-6xl bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 transition-colors">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-2xl font-semibold text-gray-700 dark:text-gray-200">Analysis Results ({filteredAnalyses.length})</h2>
                        <button onClick={() => setShowFullGraph(true)} className="bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition-colors font-semibold shadow-md text-sm">
                            Show Main Graph
                        </button>
                    </div>
                    {filteredAnalyses.length === 0 ? (
                        <p className="text-gray-500 dark:text-gray-400 text-center py-8">No analysis results match your current filters.</p>
                    ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredAnalyses.map((analysis) => (
                                <div
                                    key={analysis.id}
                                    className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-4 cursor-pointer hover:shadow-xl hover:border-indigo-500 transition-all duration-300 flex flex-col justify-between"
                                    onClick={() => handleCardClick(analysis)}
                                >
                                    <div>
                                        <h3 className="text-xl font-bold text-indigo-800 dark:text-indigo-400 mb-2">{analysis.name}</h3>
                                        <p className="text-gray-600 dark:text-gray-400 text-sm mb-3 line-clamp-3">{analysis.correlationText}</p>
                                    </div>
                                    <div className="mt-4 text-right text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">
                                        View Details &rarr;
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>

                {selectedAnalysis && (
                    <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50" onClick={closeModal}>
                        <div
                            className="bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-6 w-full max-w-2xl relative my-8 max-h-[90vh] overflow-y-auto modal-content transition-colors"
                            onClick={(e) => e.stopPropagation()}
                        >
                            <button onClick={closeModal} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 text-3xl">&times;</button>
                            <h2 className="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-4">{selectedAnalysis.name}</h2>

                            <div className="bg-indigo-50 dark:bg-indigo-900 rounded-lg p-4 mb-6 border border-indigo-200 dark:border-indigo-700">
                                <h3 className="text-lg font-semibold text-indigo-900 dark:text-indigo-200 mb-2">Synthesized Conclusion</h3>
                                <p className="text-gray-800 dark:text-gray-300 italic">{selectedAnalysis.correlationText}</p>
                            </div>

                            {selectedAnalysis.visualization_b64 ? (
                                <div className="mb-6">
                                    <h3 className="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-3">Visualization</h3>
                                    <div className="bg-gray-100 dark:bg-gray-900 p-4 rounded-lg flex justify-center border dark:border-gray-700">
                                        <img src={selectedAnalysis.visualization_b64} alt={`Visualization of ${selectedAnalysis.name}`} className="max-w-full h-auto" />
                                    </div>
                                </div>
                            ) : (
                                <div className="mb-6">
                                   <h3 className="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-3">Visualization</h3>
                                   <p className="text-gray-500 dark:text-gray-400">Visualization is not available for this item.</p>
                                </div>
                            )}

                            <h3 className="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-3">Attributes in this Group:</h3>
                            <ul className="list-disc list-inside bg-gray-50 dark:bg-gray-900 p-4 rounded-lg mb-6 text-gray-700 dark:text-gray-300">
                                {Object.keys(selectedAnalysis.attributes).map((attrName) => (
                                    <li key={attrName}>
                                        <span className="font-semibold">{attrName}:</span> {attributeMetadata[attrName]?.description || 'N/A'}
                                    </li>
                                ))}
                            </ul>

                            <OriginalResponses responses={selectedAnalysis.originalResponses} />

                            <button onClick={closeModal} className="mt-6 w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition-colors font-semibold shadow-md">
                                Close
                            </button>
                        </div>
                    </div>
                )}
                {showFullGraph && <FullGraphModal onClose={closeFullGraphModal} />}
            </div>
        );
    };

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
    </script>
</body>
</html>
